<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RPG</title>
    <style>
        :root {}

        * {
            margin: 0;
            box-sizing: border-box;
        }

        #coords {
            position: absolute;
        }

        #app {
            width: 100vw;
            height: 100vh;
            background-color: #222;
            display: flex;
            justify-content: center;
        }

        #game {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-canvas {
            width: 816px;
            height: 816px;

            image-rendering: pixelated;
        }
    </style>
<body>
    <div id="app">
        <div id="game">
            <canvas id="game-canvas" width="272" height="272"></canvas>
        </div>
        <div id="coords" style="color: #fff; font-family: 'Helvetica',serif;">Position</div> <!-- Testing -->
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
