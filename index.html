<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RPG</title>
    <style>
        :root {}

        * {
            margin: 0;
            box-sizing: border-box;
        }

        #coords {
            top: 0;
            position: absolute;
        }

        #app {
            width: 100vw;
            height: 100vh;
            background-color: #222;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-canvas {
            width: 704px;
            height: 704px;

            image-rendering: pixelated;
        }
    </style>
<body>
    <div id="app">
        <div id="game">
            <canvas id="game-canvas"></canvas>
        </div>
        <div id="coords" style="color: #fff; font-family: 'Helvetica',serif;">Position</div> <!-- Testing -->
    </div>
    <script type="module" src="js/game.js"></script>
</body>
</html>
