<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RPG</title>
    <style>
        :root {
            --tile-size: calc(100vh / 15);
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        #coords {
            position: absolute;
        }

        #app {
            width: 100vw;
            height: 100vh;
            background-color: #222;
            display: flex;
            justify-content: center;
        }

        #game {
            width: 100vh;
            height: 100vh;
            justify-content: center;
            align-items: center;
            display: flex;
            overflow: hidden;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="animations.css"></head>
<body>
    <div id="app">
        <div id="game">
            <canvas id="game-canvas" width="544" height="544"></canvas>
        </div>
        <div id="coords" style="color: #fff; font-family: 'Helvetica',serif;">Position</div> <!-- Testing -->
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
